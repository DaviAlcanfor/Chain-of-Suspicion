[project]
name = "jogo-investigativo"
version = "0.1.0"
description = "Simulação de mistério com agentes de IA: assassino, detetive e inocentes"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "BLE", "SIM", "C4", "RUF", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["jogo", "caso_exemplo"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
