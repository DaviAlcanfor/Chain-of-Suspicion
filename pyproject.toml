[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chain-of-suspicion"
version = "0.1.0"
description = "Simulação de mistério com agentes de IA: assassino, detetive e inocentes"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.2",
    "langchain-core>=1.4",
    "langchain-openai>=1.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "dishka>=1.10",
    "tenacity>=9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
files = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py314"
extend-exclude = [".claude", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ", "BLE", "SIM", "C4", "RUF", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["chain_of_suspicion", "caso_exemplo"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
"src/chain_of_suspicion/conteudo/*" = ["E501", "RUF001"]

[tool.setuptools.package-data]
chain_of_suspicion = ["prompts/**/*.md"]
